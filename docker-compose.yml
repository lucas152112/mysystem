version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: mysystem-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: mysystem
      MYSQL_USER: mysystem_user
      MYSQL_PASSWORD: mysystem_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/migrations:/docker-entrypoint-initdb.d
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - mysystem-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mysystem-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: mysql://mysystem_user:mysystem_password@mysql:3306/mysystem
      RUST_LOG: info
      RUST_BACKTRACE: 1
    depends_on:
      - mysql
    networks:
      - mysystem-network
    volumes:
      - ./backend:/app
      - cargo-cache:/usr/local/cargo/registry
      - cargo-index:/usr/local/cargo/git

  frontend:
    build:
      context: ./web-admin
      dockerfile: Dockerfile
    container_name: mysystem-frontend
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      NUXT_PUBLIC_API_BASE_URL: http://backend:3000/api
      NUXT_PUBLIC_WEBSOCKET_URL: ws://backend:3000/api/ws
      NODE_ENV: production
    depends_on:
      - backend
    networks:
      - mysystem-network

  nginx:
    image: nginx:alpine
    container_name: mysystem-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - backend
      - frontend
    networks:
      - mysystem-network

volumes:
  mysql_data:
  cargo-cache:
  cargo-index:

networks:
  mysystem-network:
    driver: bridge